# Configuración global de Gradle para el proyecto.
# Los ajustes configurados desde el IDE (Android Studio) sobrescriben este archivo.

# Memoria del demonio de Gradle (Compose + KSP se benefician de más memoria).
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Caché de configuración: acelera las compilaciones incrementales.
org.gradle.configuration-cache=true

# Estilo de código oficial de Kotlin.
kotlin.code.style=official

# Usar bibliotecas AndroidX (valor por defecto en AGP 9, se deja explícito).
android.useAndroidX=true

# Clase R no transitiva: cada módulo solo expone sus propios recursos.
android.nonTransitiveRClass=true
