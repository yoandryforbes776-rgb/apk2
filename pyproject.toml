[project]
name = "free-ai-router"
version = "1.0.0"
description = "Gateway OpenAI-compatible con rotación automática entre APIs de IA gratuitas"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.27,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
